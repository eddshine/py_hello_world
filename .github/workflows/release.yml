name: Release Windows Activator

on:
  # Pushes made with GITHUB_TOKEN do not trigger `push` workflows, so the sync job is the
  # trigger. The build reads the default branch, which already contains the sync commit.
  workflow_run:
    workflows: ["Sync Fork (Rename Upstream README)"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: "App version to publish (blank = <Version> in the csproj)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-windows-activator
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest

    steps:
      - name: Checkout the synced branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Read the app and engine versions
        id: version
        shell: pwsh
        run: |
          $csproj = "src/MasLauncher/MasLauncher.csproj"
          $declared = (Select-String -Path $csproj -Pattern '<Version>\s*([^<]+?)\s*</Version>' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          if (-not $declared) { throw "No <Version> in $csproj" }

          $engineLine = Select-String -Path "MAS/All-In-One-Version-KL/MAS_AIO.cmd" `
            -Pattern '^\s*@?\s*set\s+"?masver\s*=' | Select-Object -First 1
          if (-not $engineLine) { throw "No 'set masver=' line in the engine" }

          $engine = [regex]::Match($engineLine.Line, '=\s*v?([0-9][0-9.]*)').Groups[1].Value.TrimEnd('.')
          if (-not $engine) { throw "Could not parse the engine version" }

          # The app has its own version. The engine version is only reported in the notes.
          $manual = "${{ inputs.version }}".Trim()
          $version = $manual.TrimStart('v', 'V')
          if (-not $version) { $version = $declared }
          if ($version -notmatch '^[0-9]+(\.[0-9]+){1,2}$') {
            throw "Version '$version' must be major.minor or major.minor.patch"
          }

          # A manual build may only move the channel forward. Publishing below the csproj would
          # leave the repo claiming a version that installed copies already have, or worse, one
          # they must be offered as an "update" to go backwards.
          if ($manual) {
            $left = @($version.Split('.')) + @('0', '0', '0', '0')
            $right = @($declared.Split('.')) + @('0', '0', '0', '0')
            $order = 0
            for ($i = 0; $i -lt 4 -and $order -eq 0; $i++) {
              $order = [math]::Sign([int]$left[$i] - [int]$right[$i])
            }
            if ($order -lt 0) {
              throw "Version $version is older than the declared app version $declared."
            }
          }

          "app=$version" >> $env:GITHUB_OUTPUT
          "declared=$declared" >> $env:GITHUB_OUTPUT
          "engine=$engine" >> $env:GITHUB_OUTPUT
          Write-Host "App $version (csproj $declared), engine $engine"

      - name: Check whether this version is already published
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.version.outputs.app }}"
          $seen = gh release view $tag --json tagName 2>&1
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            "skip=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release $tag already exists; nothing to publish."
          } else {
            # `gh` exits 1 when the release is missing, which is the normal first-build path.
            # Without the explicit exit below, PowerShell would end this step with that status
            # and fail the job before anything is built.
            Write-Host "No release $tag yet ($code): $seen"
            "skip=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Set up .NET 8
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Release builds are obfuscated, which needs the pinned Obfuscar tool.
      - name: Restore the build tools
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        run: |
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { throw "dotnet tool restore failed" }

      - name: Build and run the headless checks
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.app }}
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null

          dotnet build src/MasLauncher/MasLauncher.csproj -c Release -p:Version=$env:APP_VERSION
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }

          $dll = Get-ChildItem -Path src/MasLauncher/bin/Release -Recurse -Filter WinAct.dll |
            Select-Object -First 1
          if (-not $dll) { throw "Built WinAct.dll was not found" }

          # The shipped build must not carry readable type names. If Obfuscar did not run, stop
          # here instead of publishing the source code in plain form.
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($dll.FullName))
          foreach ($name in @('AppUpdater', 'ConsoleSession', 'TerminalView', 'RoundedButton')) {
            if ($text.Contains($name)) { throw "The built assembly is not obfuscated ($name is readable)" }
          }
          Write-Host "Obfuscated: no readable type names in $($dll.Name)"

          dotnet exec $dll.FullName --enginetest out/enginetest.txt
          if ($LASTEXITCODE -ne 0) {
            Get-Content out/enginetest.txt
            throw "Embedded engine check failed"
          }

          dotnet exec $dll.FullName --selftest out/selftest.txt
          if ($LASTEXITCODE -ne 0) {
            Get-Content out/selftest.txt
            throw "Self-test failed"
          }

          # Every visible string and tooltip must still read correctly through the string hiding.
          dotnet exec $dll.FullName --wording out/wording.txt
          if ($LASTEXITCODE -ne 0) {
            Get-Content out/wording.txt
            throw "Wording check failed"
          }

          # Starts the real engine and waits for its menu: proves the extracted copy runs, which
          # a temp folder would refuse.
          dotnet exec $dll.FullName --enginelaunch out/enginelaunch.txt
          if ($LASTEXITCODE -ne 0) {
            Get-Content out/enginelaunch.txt
            throw "The embedded engine did not start"
          }

          Get-Content out/enginetest.txt
          Get-Content out/selftest.txt
          Get-Content out/wording.txt
          Get-Content out/enginelaunch.txt

      - name: Publish the single-file launcher
        id: build
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.app }}
        run: |
          dotnet publish src/MasLauncher/MasLauncher.csproj -c Release -o out -p:Version=$env:APP_VERSION
          if ($LASTEXITCODE -ne 0) { throw "Publish failed" }

          # The published build carries its version: "WinAct <version>.exe".
          $exe = Get-Item "out/WinAct $env:APP_VERSION.exe"
          $reported = [regex]::Match($exe.VersionInfo.ProductVersion, '[0-9]+(\.[0-9]+)+').Value
          $want = $env:APP_VERSION

          function Normalize([string]$value) {
            $parts = $value.Split('.')
            while ($parts.Count -gt 2 -and $parts[-1] -eq '0') {
              $parts = $parts[0..($parts.Count - 2)]
            }
            return ($parts -join '.')
          }

          if ((Normalize $reported) -ne (Normalize $want)) {
            throw "The EXE reports $reported, expected $want"
          }

          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$sha" >> $env:GITHUB_OUTPUT
          Write-Host ("Built {0:N0} bytes, SHA-256 {1}" -f $exe.Length, $sha)

      - name: Publish the release
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.app }}
          ENGINE_VERSION: ${{ steps.version.outputs.engine }}
          SHA256: ${{ steps.build.outputs.sha256 }}
        run: |
          $target = (git rev-parse HEAD).Trim()
          $notes = @(
            "WinAct $env:APP_VERSION"
            ""
            "App version $env:APP_VERSION. Embeds Microsoft Activation Scripts (MAS) $env:ENGINE_VERSION, unmodified."
            ""
            "SHA-256: $env:SHA256"
          ) -join "`n"
          $notes | Out-File -FilePath NOTES.md -Encoding utf8

          gh release create "v$env:APP_VERSION" "out/WinAct $env:APP_VERSION.exe" `
            --title "$env:APP_VERSION" `
            --notes-file NOTES.md `
            --target $target `
            --latest

          if ($LASTEXITCODE -ne 0) { throw "Could not publish the release" }
