name: Sync Fork (Rename Upstream README)

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch and Merge Upstream
        run: |
          # 1. Add the FULL massgravel repository URL here:
          git remote add upstream https://github.com/massgravel/Microsoft-Activation-Scripts.git
          git fetch upstream

          # 2. Grab the absolute newest README file directly from massgravel's master branch
          git show upstream/master:README.md > Original_Updated_Readme.md

          # 3. Merge the rest of the upstream master changes without committing yet
          git merge upstream/master --no-commit --no-ff || true

          # 4. Ensure YOUR original README.md stays exactly as it was
          git checkout HEAD -- README.md

          # 5. Stage the newly renamed file
          git add Original_Updated_Readme.md

          # 6. Finalize commit and push back to your master branch
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto-sync from massgravel (Saved upstream README as Original_Updated_Readme.md)"
            git push origin master
          else
            echo "No new changes to sync."
          fi
