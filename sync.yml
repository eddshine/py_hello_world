name: Sync Fork

on:
  schedule:
    # Runs every day at midnight UTC (Adjust this cron schedule if needed)
    - cron: '0 0 * * *'
  # Allows you to manually trigger the sync at any time from the Actions tab
  workflow_dispatch: 

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4

      - name: Sync Upstream
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.1
        with:
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          # The original repository you forked from (e.g., owner/repo)
          upstream_repository: massgravel/Microsoft-Activation-Scripts
          # The branch you want to sync (usually main or master)
          upstream_branch: main
          target_branch: main
          # Set to true if you want to force sync and overwrite conflicting changes
          force: false 
