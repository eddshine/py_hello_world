name: Sync Fork (Keep Local README)

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows you to trigger it manually anytime

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches history so git can merge properly

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"

      - name: Fetch and Merge Upstream
        run: |
          # 1. Add massgravel as the upstream remote
          git remote add upstream https://github.com
          git fetch upstream

          # 2. Merge upstream master changes into your branch without committing yet
          git merge upstream/master --no-commit --no-ff || true

          # 3. Force restore your fork's original README.md file
          git checkout HEAD -- README.md

          # 4. Finalize the commit and push changes
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto-sync from massgravel (excluding README.md)"
            git push origin master
          else
            echo "No new changes to sync."
          fi
